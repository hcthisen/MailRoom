  securitySchemes:
    bearer:
      bearerFormat: mr_...
      description: An API token created with `mailroom token create` or POST /tokens. Scope admin may call everything, scope read only read operations.
      scheme: bearer
      type: http
info:
  description: |-
    The complete REST API of Mailroom: every record, setting and action is here (PRD G-1).

    Authenticate with `Authorization: Bearer mr_...`. Errors always look like `{"error": {"code": "...", "message": "...", "field": "..."}}`. Send an `Idempotency-Key` header on every POST, `If-Match` with the ETag on updates, and use `?dry_run=true` where offered. A guide with recipes is at `/api/v1/docs`.
  license:
    name: MIT
  title: Mailroom API
  version: dev
openapi: 3.1.0
paths:
  /audit:
    get:
      description: |-
        Returns audit log entries, newest first. Every write made through the API or the UI is logged with its actor (user or token), time, operation, target and changed fields (G-8). Filter with the query parameters and page with `cursor`.

        Needs an API token with scope `read` or `admin`.
      operationId: list-audit-log
      parameters:
        - description: Maximum number of items to return (1-500).
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum number of items to return (1-500).
            examples:
              - 50
            format: int64
            maximum: 500
