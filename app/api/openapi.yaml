        Returns the numbers of the admin dashboard (A-3): contacts in total and active, new contacts in the last 7 and 30 days, unsubscribes in the last 30 days, broadcast, sequence and opt-in emails sent this month (in the settings time zone) and in the last 30 days, and the hard-bounce and complaint rates of the emails sent in the last 30 days. Test sends and alerts are not counted. The message numbers are cached for up to a minute; the contact numbers are recomputed as soon as contacts are added, erased or change status. The SES quota is at GET /system/ses and the doctor checks at GET /system/doctor.

