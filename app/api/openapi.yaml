      tags:
        - Segments
      x-mailroom-scope: read
    post:
      description: |-
        Saves a named filter. Names are unique, ignoring case (409 on a duplicate). With `?dry_run=true` the segment is validated and returned but not saved.

        A filter is `{"match": "all"|"any", "rules": [...]}`; each rule is a condition or a nested group `{"match": ..., "rules": [...]}` (groups nest up to depth 3). Conditions: `{"field":"tag","op":"has"|"not_has","value":"name"}`, `{"field":"tags","op":"has_all"|"has_any"|"has_none","values":[...]}`, `{"field":"status","op":"is"|"is_not","value":"active"}`, `{"field":"email","op":"eq"|"contains"|"ends_with","value":"..."}`, `{"field":"first_name"|"last_name","op":"eq"|"contains"|"is_empty"|"not_empty","value":"..."}`, `{"field":"created_at","op":"before"|"after","value":"2026-01-01T00:00:00Z"}` or `{"field":"created_at","op":"within_days","days":30}`, `{"field":"attr","key":"plan","op":"eq"|"neq"|"contains"|"exists"|"not_exists","value":"pro"}` (value: string, number or boolean; the type must match the stored one), `{"field":"clicked","op":"any_link"|"link"|"no_click","url":"...","broadcast_id":12,"within_days":30}` (url required for link, optional for no_click). Text comparisons ignore case; `contains` and `ends_with` match literally. Tags are referenced by name; `missing_tags` in counts and previews lists names that no tag has (a has rule on one matches nobody, a not_has/has_none rule everybody). A filter never adds a status condition by itself. Validation errors name the offending input, e.g. field `filter.rules[2].value`.

        Needs an API token with scope `admin`.
      operationId: create-segment
      parameters:
        - description: Run the operation in a transaction that is rolled back, and return what would happen without changing anything.
          explode: false
          in: query
          name: dry_run
          schema:
            description: Run the operation in a transaction that is rolled back, and return what would happen without changing anything.
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Segment"
          description: "Dry run (?dry_run=true): what would be created, validated but not stored. Its `id` and any public ID or URL are not kept (they don't exist, and a later create may get them), and there is no ETag"
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Segment"
          description: Created
          headers:
            ETag:
              schema:
                description: Version of the segment; send it back in If-Match
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Create a segment
      tags:
        - Segments
      x-mailroom-scope: admin
  /segments/preview:
    post:
