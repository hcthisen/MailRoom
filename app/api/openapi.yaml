    patch:
      description: |-
        Partially updates the settings: only the fields you send change (nested objects are merged). `default_send_window: null` removes the default send window. `sender.from_email` and `sender.reply_to` must be on the sending domain (D-7), and `domain` can't be changed. Send the ETag from GET in If-Match to get 412 instead of overwriting someone else's change. Every change is written to the audit log.

        Needs an API token with scope `admin`.
      operationId: update-settings
