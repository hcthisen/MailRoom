components:
  schemas:
    AcceptedBody:
      additionalProperties: false
      properties:
        job:
          $ref: "#/components/schemas/Job"
      required:
        - job
      type: object
    Account:
      additionalProperties: false
      properties:
        enforcement_status:
          description: "SES enforcement status: HEALTHY, PROBATION or SHUTDOWN"
          examples:
            - HEALTHY
          type: string
        fetched_at:
          description: When the snapshot was taken
          format: date-time
          type: string
        max_24_hour_send:
          description: SES 24-hour sending quota; -1 means unlimited
          examples:
            - 50000
          format: double
          type: number
        max_send_rate:
          description: SES maximum send rate (messages per second)
          examples:
            - 14
          format: double
          type: number
        production_access_enabled:
          description: False while the account is in the SES sandbox
          examples:
            - true
          type: boolean
        sending_enabled:
          description: Whether SES currently allows the account to send
          examples:
            - true
          type: boolean
        sent_last_24_hours:
          description: Messages SES sent from the account in the last 24 hours
          examples:
            - 1200
          format: double
          type: number
      required:
        - max_send_rate
        - max_24_hour_send
        - sent_last_24_hours
        - sending_enabled
        - production_access_enabled
        - enforcement_status
        - fetched_at
      type: object
    Actor:
      additionalProperties: false
      properties:
        id:
          examples:
            - "3"
          type: string
        name:
          description: User email or token name
          examples:
            - setup-agent
          type: string
        type:
          enum:
            - user
            - token
            - system
            - public
            - cli
          examples:
            - token
          type: string
      required:
        - type
        - id
        - name
      type: object
    AddStepInputBody:
      additionalProperties: false
      properties:
        delay_seconds:
          description: "Delay after the previous step was queued (the first step: after enrolment)"
          examples:
            - 86400
          format: int64
          maximum: 31536000
          minimum: 0
          type: integer
        email:
          $ref: "#/components/schemas/StepEmail"
          description: Create a new email with this content for the step; give this or email_id
        email_id:
          description: Send this existing email; give this or email
          examples:
            - 21
          format: int64
          minimum: 1
          type: integer
        position:
          description: "Insert at this position (later steps move down); default: at the end"
          examples:
            - 2
          format: int64
          minimum: 1
          type: integer
      required:
        - delay_seconds
      type: object
    AddTagsInputBody:
      additionalProperties: false
      properties:
        tags:
          description: Tags to add; created as needed
          examples:
            - - customer
          items:
            type: string
          maxItems: 100
          minItems: 1
          type:
            - array
            - "null"
      required:
        - tags
      type: object
    Attachment:
      additionalProperties: false
      properties:
        content_id:
          description: "For inline images referenced as cid: in the HTML"
          examples:
            - ""
          type: string
        content_type:
          examples:
            - application/pdf
          type: string
        filename:
          examples:
            - invoice.pdf
          type: string
        inline:
          type: boolean
        position:
          description: 1-based; use it to download the attachment
          examples:
            - 1
          format: int64
          type: integer
        size_bytes:
          examples:
            - 48213
          format: int64
          type: integer
      required:
        - position
        - filename
        - content_type
        - content_id
        - inline
        - size_bytes
      type: object
    BackupInfo:
      additionalProperties: false
      properties:
        created_at:
          description: When the backup was taken (from its name)
          format: date-time
          type: string
        name:
          description: File name in the backups directory; use it to download the backup
          examples:
            - mailroom-20260105T023000Z.db
          type: string
        size_bytes:
          description: File size in bytes
          examples:
            - 1048576
          format: int64
          type: integer
      required:
        - name
        - size_bytes
        - created_at
      type: object
    BackupList:
      additionalProperties: false
      properties:
        items:
          description: Local backups, newest first
          items:
            $ref: "#/components/schemas/BackupInfo"
          type:
            - array
            - "null"
        next_cursor:
          description: "Always empty: every local backup is listed on one page"
          type: string
        schedule:
          $ref: "#/components/schemas/BackupSchedule"
      required:
        - items
        - next_cursor
        - schedule
      type: object
    BackupSchedule:
      additionalProperties: false
      properties:
        local_time:
          description: Time of day of the nightly backup, in timezone
          examples:
            - "02:30"
          type: string
        next_run_at:
          description: When the next nightly backup runs (UTC)
          format: date-time
          type: string
        retention_days:
          description: Local backups older than this are deleted
          examples:
            - 14
          format: int64
          type: integer
        s3_bucket:
          description: Bucket each backup is uploaded to (BACKUP_BUCKET); empty when uploads are off
          examples:
            - mailroom-backup-example
          type: string
        timezone:
          description: The settings time zone
          examples:
            - Europe/London
          type: string
      required:
        - next_run_at
        - local_time
        - timezone
        - retention_days
        - s3_bucket
      type: object
    Broadcast:
      additionalProperties: false
      properties:
        archive_url:
          description: "The public web archive page (B-10): set once a broadcast to everyone has gone out (sending, paused or sent). Rendered without contact data, merge fields show their fallbacks, no tracking."
          examples:
            - https://newsletter.example.com/archive/7
          readOnly: true
          type: string
        audience:
          $ref: "#/components/schemas/BroadcastAudience"
        created_at:
          format: date-time
          type: string
        email:
          $ref: "#/components/schemas/BroadcastEmail"
        finished_at:
          description: When the broadcast was sent or cancelled
          format: date-time
          type:
            - string
            - "null"
        from_name:
          description: From display name; null means the settings default
          examples:
            - Example News
          type:
            - string
            - "null"
        id:
          examples:
            - 7
          format: int64
          type: integer
        name:
          description: Internal name
          examples:
            - October newsletter
          type: string
        paused_reason:
          description: Why the broadcast is paused; empty unless paused
          enum:
            - ""
            - manual
            - circuit_breaker
            - snapshot_failed
            - ses_paused
          examples:
            - ""
          type: string
        recipients_total:
          description: Messages queued by the snapshot (final once snapshot_done_at is set)
          examples:
            - 1180
          format: int64
          type: integer
        reply_to:
          description: Reply-To address on the sending domain; null means the settings default, "" none
          examples:
            - hello@example.com
          type:
            - string
            - "null"
        scheduled_at:
          description: When a scheduled broadcast starts
          format: date-time
          type:
            - string
            - "null"
        snapshot_done_at:
          description: When every recipient had been queued
          format: date-time
          type:
            - string
            - "null"
        snapshot_job_id:
          description: The broadcast.snapshot job; poll GET /jobs/{id}
          examples:
            - 41
          format: int64
          type:
            - integer
            - "null"
        started_at:
          description: When sending started
          format: date-time
          type:
            - string
            - "null"
        status:
          enum:
            - draft
            - scheduled
            - sending
            - paused
            - sent
            - cancelled
          examples:
            - draft
          type: string
        updated_at:
          format: date-time
          type: string
        version:
          description: Increases with every change of the broadcast or its email; sent as the ETag
          examples:
            - 3
          format: int64
          type: integer
      required:
        - id
        - name
        - status
        - audience
        - from_name
        - reply_to
        - email
        - paused_reason
        - scheduled_at
        - started_at
        - finished_at
        - recipients_total
        - snapshot_job_id
        - snapshot_done_at
        - version
        - created_at
        - updated_at
      type: object
    BroadcastAudience:
      additionalProperties: false
      properties:
        segment_id:
          description: The segment (type segment only)
          examples:
            - 3
          format: int64
          minimum: 0
          type: integer
        segment_name:
          description: The segment's name when the audience was set
          examples:
            - Customers
          readOnly: true
          type: string
        type:
          description: "all: every active contact; segment: the active members of segment_id"
          enum:
            - all
            - segment
          examples:
            - segment
          type: string
      required:
        - type
      type: object
    BroadcastAudienceInput:
      additionalProperties: false
      properties:
        segment_id:
          description: The segment (type segment only)
          examples:
            - 3
          format: int64
          minimum: 0
          type: integer
        type:
          description: "all: every active contact; segment: the active members of segment_id"
          enum:
            - all
            - segment
          examples:
            - segment
          type: string
      required:
        - type
      type: object
    BroadcastEmail:
      additionalProperties: false
      properties:
        body:
          description: The content (omitted in lists)
          examples:
            - |-
              Hi {{first_name | "there"}},

              Here is our news.
          type: string
        format:
          description: markdown or html
          enum:
            - markdown
            - html
          examples:
            - markdown
          type: string
        id:
          description: The email's ID (owned by this broadcast)
          examples:
            - 12
          format: int64
          readOnly: true
          type: integer
        preheader:
          description: Preview text shown after the subject
          examples:
            - Three things worth knowing
          type: string
        subject:
          description: Subject line; may use merge fields
          examples:
            - Our autumn news
          type: string
      required:
        - id
        - subject
        - preheader
        - format
      type: object
    BroadcastEmailInput:
      additionalProperties: false
      properties:
        body:
          description: "The content, at most 1 MiB, wrapped in the base layout when sent. Merge fields: {{first_name}}, {{last_name}}, {{email}}, {{attr.<key>}}, each with an optional fallback like {{first_name | \"there\"}}"
          examples:
            - |-
              Hi {{first_name | "there"}},

              Here is our news.
          type: string
        format:
          description: markdown (default) or html
          enum:
            - markdown
            - html
          examples:
            - markdown
          type: string
        preheader:
          description: Preview text shown after the subject in the inbox
          examples:
            - Three things worth knowing
          maxLength: 300
          type: string
        subject:
          description: Subject line (required); may use merge fields
          examples:
            - Our autumn news, {{first_name | "friend"}}
          maxLength: 300
          type: string
      required:
        - subject
        - body
      type: object
    BroadcastLinkClicks:
      additionalProperties: false
      properties:
        clicks:
          description: All clicks
          examples:
            - 57
          format: int64
          type: integer
        unique:
          description: Recipients who clicked it
          examples:
            - 41
          format: int64
          type: integer
        url:
          examples:
            - https://example.com/offer
          type: string
      required:
        - url
        - clicks
        - unique
      type: object
    BroadcastRates:
      additionalProperties: false
      properties:
        bounce:
          description: bounced / sent
          examples:
            - 0.01
          format: double
          type: number
        click:
          description: unique_clicks / sent
          examples:
            - 0.035
          format: double
          type: number
        complaint:
          description: complained / sent
          examples:
            - 0
          format: double
          type: number
        delivery:
          description: delivered / sent
          examples:
            - 0.98
          format: double
          type: number
        unsubscribe:
          description: unsubscribed / sent
          examples:
            - 0.002
          format: double
          type: number
      required:
        - delivery
        - bounce
        - complaint
        - unsubscribe
        - click
      type: object
    BroadcastRecipient:
      additionalProperties: false
      properties:
        attempts:
          examples:
            - 1
          format: int64
          type: integer
        contact_id:
          description: null after the contact was erased
          examples:
            - 42
          format: int64
          type:
            - integer
            - "null"
        delivered_at:
          format: date-time
          type:
            - string
            - "null"
        email:
          description: The recipient address; null after erase
          examples:
            - ann@example.com
          type:
            - string
            - "null"
        error:
          description: Why the message failed or was skipped
          examples:
            - ""
          type: string
        message_id:
          examples:
            - 9001
          format: int64
          type: integer
        queued_at:
          format: date-time
          type: string
        sent_at:
          format: date-time
          type:
            - string
            - "null"
        status:
          enum:
            - queued
            - sending
            - sent
            - delivered
            - bounced
            - complained
            - failed
            - skipped
          examples:
            - delivered
          type: string
      required:
        - message_id
        - contact_id
        - email
        - status
        - error
        - attempts
        - queued_at
        - sent_at
        - delivered_at
      type: object
    BroadcastSendResult:
      additionalProperties: false
      properties:
        broadcast:
          $ref: "#/components/schemas/Broadcast"
          description: "The broadcast. For a dry run it is unchanged, as stored (status, version and snapshot_job_id as before): the transition is checked but not kept"
        dry_run:
          description: true when nothing was changed
          examples:
            - false
          type: boolean
        job:
          $ref: "#/components/schemas/Job"
          description: The broadcast.snapshot job queueing the recipients (omitted for a dry run)
        missing_tags:
          description: Tag names the audience segment refers to that no tag has (renamed, merged or deleted); check the segment when this is not empty
          examples:
            - []
          items:
            type: string
          type:
            - array
            - "null"
        recipients:
          description: "Active, unsuppressed contacts in the audience right now: the messages the snapshot will queue"
          examples:
            - 1180
          format: int64
          type: integer
      required:
        - dry_run
        - recipients
        - missing_tags
        - broadcast
      type: object
    BroadcastStats:
      additionalProperties: false
      properties:
        bounced:
          description: Messages that hard-bounced
          examples:
            - 12
          format: int64
          type: integer
        broadcast_id:
          examples:
            - 7
          format: int64
          type: integer
        clicks:
          description: All clicks
          examples:
            - 70
          format: int64
          type: integer
        clicks_per_link:
          description: Clicks per link, most clicked first
          items:
            $ref: "#/components/schemas/BroadcastLinkClicks"
          type:
            - array
            - "null"
        complained:
          description: Messages the recipient reported as spam (not-spam feedback reports excluded)
          examples:
            - 1
          format: int64
          type: integer
        delivered:
          examples:
            - 1160
          format: int64
          type: integer
        failed:
          description: Messages the provider refused or that failed after retries
          examples:
            - 2
          format: int64
          type: integer
        missing_tags:
          description: Tag names the audience segment refers to that no tag has
          examples:
            - []
          items:
            type: string
          type:
            - array
            - "null"
        queued:
          description: Messages not sent yet (queued or being sent)
          examples:
            - 0
          format: int64
          type: integer
        rates:
          $ref: "#/components/schemas/BroadcastRates"
        recipients:
          description: Messages queued by the snapshot
          examples:
            - 1180
          format: int64
          type: integer
        sent:
          description: Messages accepted by SES (incl. those delivered, bounced or complained about later)
          examples:
            - 1175
          format: int64
          type: integer
        skipped:
          description: Messages not sent because the contact became inactive or suppressed, or the broadcast was cancelled
          examples:
            - 3
          format: int64
          type: integer
        status:
          enum:
            - draft
            - scheduled
            - sending
            - paused
            - sent
            - cancelled
          examples:
            - sent
          type: string
        unique_clicks:
          description: Recipients who clicked at least one link
          examples:
            - 41
          format: int64
          type: integer
        unsubscribed:
          description: Recipients who unsubscribed from this broadcast
          examples:
            - 4
          format: int64
          type: integer
      required:
        - broadcast_id
        - status
        - recipients
        - queued
        - sent
        - delivered
        - bounced
        - complained
        - failed
        - skipped
        - unsubscribed
        - unique_clicks
        - clicks
        - clicks_per_link
        - rates
        - missing_tags
      type: object
    BroadcastTestResult:
      additionalProperties: false
      properties:
        message_ids:
          description: The queued test messages, one per address
          examples:
            - - 901
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        to:
          description: The normalised addresses, in the same order
          examples:
            - - owner@example.org
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - message_ids
        - to
      type: object
    BulkTagInput:
      additionalProperties: false
      properties:
        action:
          description: add or remove the tag
          enum:
            - add
            - remove
          examples:
            - add
          type: string
        contact_ids:
          description: The contacts to change; give this or segment_id
          examples:
            - - 12
              - 15
          items:
            format: int64
            type: integer
          maxItems: 50000
          type:
            - array
            - "null"
        segment_id:
          description: Change every contact in this segment; give this or contact_ids
          examples:
            - 3
          format: int64
          minimum: 1
          type: integer
        tag:
          description: The tag name
          examples:
            - customer
          maxLength: 64
          minLength: 1
          type: string
      required:
        - tag
        - action
      type: object
    BulkTagResult:
      additionalProperties: false
      properties:
        job:
          $ref: "#/components/schemas/Job"
          description: The job doing the work; absent in a dry run
        matched:
          description: Contacts matched now (existing contacts, or current segment members)
          examples:
            - 250
          format: int64
          type: integer
      required:
        - matched
      type: object
    Check:
      additionalProperties: false
      properties:
        fix_hint:
          description: How to fix a warn or fail
          examples:
            - ""
          type: string
        message:
          description: What was found
          examples:
            - 3 of 3 DKIM CNAME records point to SES
          type: string
        name:
          description: Check name
          examples:
            - dns_dkim
          type: string
        status:
          description: ok, warn, fail, or skipped when the check doesn't apply
          enum:
            - ok
            - warn
            - fail
            - skipped
          examples:
            - ok
          type: string
      required:
        - name
        - status
        - message
      type: object
    CircuitBreaker:
      additionalProperties: false
      properties:
        complaint_rate:
          description: Pause when the complaint rate exceeds this fraction
          examples:
            - 0.001
          exclusiveMinimum: 0
          format: double
          maximum: 1
          type: number
        hard_bounce_rate:
          description: Pause when the hard-bounce rate exceeds this fraction
          examples:
            - 0.05
          exclusiveMinimum: 0
          format: double
          maximum: 1
          type: number
        min_messages:
          description: Rates are checked only after this many messages of a broadcast
          examples:
            - 200
          format: int64
          maximum: 1000000
          minimum: 1
          type: integer
      required:
        - min_messages
        - hard_bounce_rate
        - complaint_rate
      type: object
    CircuitBreakerPatch:
      additionalProperties: false
      properties:
        complaint_rate:
          exclusiveMinimum: 0
          format: double
          maximum: 1
          type: number
        hard_bounce_rate:
          exclusiveMinimum: 0
          format: double
          maximum: 1
          type: number
        min_messages:
          format: int64
          maximum: 1000000
          minimum: 1
          type: integer
      type: object
    Click:
      additionalProperties: false
      properties:
        broadcast_id:
          description: Broadcast of the clicked message; 0 otherwise
          examples:
            - 7
          format: int64
          type: integer
        contact_id:
          description: 0 after the contact was erased
          examples:
            - 311
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        id:
          examples:
            - 501
          format: int64
          type: integer
        link_id:
          examples:
            - 9
          format: int64
          type: integer
        message_id:
          description: 0 when the message was deleted
          examples:
            - 1042
          format: int64
          type: integer
        url:
          examples:
            - https://example.com/offer
          type: string
      required:
        - id
        - link_id
        - url
        - message_id
        - contact_id
        - broadcast_id
        - created_at
      type: object
    ConfirmTOTPInputBody:
      additionalProperties: false
      properties:
        code:
          description: The current 6-digit code from the authenticator app
          examples:
            - "123456"
          maxLength: 8
          minLength: 6
          type: string
        secret:
          description: The secret returned by begin-user-totp
          maxLength: 128
          type: string
      required:
        - secret
        - code
      type: object
    Consent:
      additionalProperties: false
      properties:
        occurred_at:
          description: When consent was given (RFC 3339); default now
          format: date-time
          type: string
        source:
          description: Where consent was given, e.g. "webinar-2026"; recorded as api:<token name>:<source>
          examples:
            - webinar-2026
          maxLength: 200
          type: string
        text:
          description: The consent text the person agreed to
          examples:
            - Yes, send me the newsletter. Clicks are tracked per person.
          maxLength: 5000
          type: string
      type: object
    ConsentRecord:
      additionalProperties: false
      properties:
        consent_text:
          type: string
        created_at:
          format: date-time
          type: string
        form_id:
          format: int64
          type: integer
        id:
          format: int64
          type: integer
        ip:
          type: string
        occurred_at:
          format: date-time
          type: string
        source:
          type: string
        type:
          type: string
        user_agent:
          type: string
      required:
        - id
        - type
        - source
        - ip
        - user_agent
        - consent_text
        - occurred_at
        - created_at
      type: object
    Contact:
      additionalProperties: false
      properties:
        attributes:
          additionalProperties: {}
          description: Custom attributes (JSON object)
          type: object
        created_at:
          format: date-time
          type: string
        email:
          examples:
            - alice@example.com
          type: string
        first_name:
          examples:
            - Alice
          type: string
        id:
          examples:
            - 42
          format: int64
          type: integer
        last_name:
          examples:
            - Smith
          type: string
        status:
          description: Global status; only active contacts receive marketing email
          enum:
            - pending
            - active
            - unsubscribed
            - bounced
            - complained
            - suppressed_manual
          examples:
            - active
          type: string
        status_changed_at:
          format: date-time
          type: string
        tags:
          description: Tag names, sorted case-insensitively
          examples:
            - - customer
              - newsletter
          items:
            type: string
          type:
            - array
            - "null"
        unsubscribe_requested_at:
          description: Set when the contact asked to unsubscribe while bounced, complained or manually suppressed (its status can't become unsubscribed then). Lifting the bounce or the suppression later makes it unsubscribed, not active
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
        version:
          description: Version used for ETag / If-Match
          examples:
            - 3
          format: int64
          type: integer
      required:
        - id
        - email
        - first_name
        - last_name
        - attributes
        - tags
        - status
        - status_changed_at
        - created_at
        - updated_at
        - version
      type: object
