        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Form"
          description: Created
          headers:
            ETag:
              schema:
                description: Version of the form; send it back in If-Match
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "429":
          content:
