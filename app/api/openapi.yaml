  /system/ses:
    get:
      description: |-
        Returns the SES account status: production access (sandbox or not), whether sending is enabled, the enforcement status, and the sending quota (daily limit, sent in the last 24 hours, maximum rate). It serves the sender's last poll (every 5 minutes) and reads SES live when that is missing or older than 15 minutes, or with `refresh=true`. Answers 409 when AWS isn't configured.

        Needs an API token with scope `read` or `admin`.
      operationId: get-ses-status
      parameters:
        - description: Read the status from SES now instead of the sender's last poll
          explode: false
          in: query
          name: refresh
          schema:
            description: Read the status from SES now instead of the sender's last poll
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SESStatus"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
