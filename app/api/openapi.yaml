              - 50
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - description: "Opaque cursor: the next_cursor of the previous page. Omit for the first page."
          explode: false
          in: query
          name: cursor
          schema:
            description: "Opaque cursor: the next_cursor of the previous page. Omit for the first page."
            maxLength: 128
            type: string
        - description: Only contacts whose email, first name, last name or full name contains this (case-insensitive)
          explode: false
          in: query
          name: q
          schema:
            description: Only contacts whose email, first name, last name or full name contains this (case-insensitive)
            examples:
              - smith
            maxLength: 254
            type: string
        - description: "Only the contact with exactly this address (compared normalised: trimmed and lowercased); look up a contact by email"
          explode: false
          in: query
          name: email
          schema:
            description: "Only the contact with exactly this address (compared normalised: trimmed and lowercased); look up a contact by email"
            examples:
              - alice@example.com
            maxLength: 254
            type: string
        - description: Only contacts with this status
          explode: false
          in: query
          name: status
          schema:
            description: Only contacts with this status
            enum:
              - pending
              - active
              - unsubscribed
              - bounced
              - complained
              - suppressed_manual
            type: string
        - description: Only contacts with this tag (case-insensitive)
          explode: false
          in: query
          name: tag
          schema:
            description: Only contacts with this tag (case-insensitive)
            examples:
              - customer
            maxLength: 64
            type: string
        - description: Only contacts created at or after this time (RFC 3339)
          explode: false
          in: query
          name: created_after
          schema:
            description: Only contacts created at or after this time (RFC 3339)
            format: date-time
            type: string
        - description: Only contacts created before this time (RFC 3339)
          explode: false
          in: query
          name: created_before
          schema:
            description: Only contacts created before this time (RFC 3339)
            format: date-time
            type: string
        - description: Attribute filter "key:value" (exact match, e.g. attr=company:Acme); repeat for several
          explode: true
          in: query
          name: attr
          schema:
            description: Attribute filter "key:value" (exact match, e.g. attr=company:Acme); repeat for several
            examples:
              - - company:Acme
            items:
              type: string
            maxItems: 10
            type:
              - array
              - "null"
        - description: Only current members of this segment
          explode: false
          in: query
          name: segment_id
          schema:
            description: Only current members of this segment
            format: int64
            minimum: 1
            type: integer
      responses:
