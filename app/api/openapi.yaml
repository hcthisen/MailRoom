      summary: List suppressions
      tags:
        - Suppressions
      x-mailroom-scope: read
    post:
      description: |-
        Adds the address to the suppression list (reason manual): it can't be emailed, imported or signed up. An active contact with that address is set to suppressed_manual; other statuses are kept. Answers 201, or 200 when the address was already suppressed.

        Needs an API token with scope `admin`.
      operationId: add-suppression
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuppressionInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuppressResult"
          description: Created
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
