    get:
      description: |-
        Returns contacts newest first, with their tags. Filters combine with AND: `q` (email or name contains), `email` (exact address: a lookup by email), `status`, `tag`, `created_after`/`created_before`, `attr=key:value` (repeatable, exact match) and `segment_id` (current segment members). Paginate with `limit` and `cursor`.

        Needs an API token with scope `read` or `admin`.
      operationId: list-contacts
      parameters:
        - description: Maximum number of items to return (1-500).
          explode: false
