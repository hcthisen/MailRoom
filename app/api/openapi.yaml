  /suppressions:
    get:
      description: |-
        Returns suppressed addresses newest first, as SHA-256 hashes of the normalised address: `erased` rows come from GDPR erase, `manual` ones from add-suppression. To check one address, pass the hash of its trimmed, lowercased form as `email_hash`. Bounced, complained and unsubscribed contacts are statuses, not suppressions (see list-contacts).

        Needs an API token with scope `read` or `admin`.
      operationId: list-suppressions
      parameters:
        - description: Maximum number of items to return (1-500).
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum number of items to return (1-500).
            examples:
              - 50
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - description: "Opaque cursor: the next_cursor of the previous page. Omit for the first page."
          explode: false
          in: query
          name: cursor
          schema:
            description: "Opaque cursor: the next_cursor of the previous page. Omit for the first page."
            maxLength: 128
            type: string
        - description: Only suppressions with this reason
          explode: false
          in: query
          name: reason
          schema:
            description: Only suppressions with this reason
            enum:
              - erased
              - manual
            type: string
        - description: Only the suppression with this SHA-256 hex of the normalised (trimmed, lowercased) address
          explode: false
          in: query
          name: email_hash
          schema:
            description: Only the suppression with this SHA-256 hex of the normalised (trimmed, lowercased) address
            pattern: ^[0-9a-fA-F]{64}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodySuppression"
