        Removes a manual suppression (404 if the address isn't suppressed). Erased addresses stay suppressed (403), and bounces and complaints can't be removed. A contact with status suppressed_manual is set back to active with the note (recorded in its consent log), or to unsubscribed when it asked to unsubscribe while suppressed; `status` says which. The address goes in the body, not the URL, to keep it out of logs.

