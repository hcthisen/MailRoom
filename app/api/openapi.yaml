        The public endpoint `POST /f/{public_id}` takes form-encoded or JSON fields `email`, `first_name`, `last_name` and `attr.<key>` (only the form's fields are used). A filled-in `website` field (the hidden honeypot) is treated as spam; each client address may submit 10 times per minute. JSON or XMLHttpRequest clients get `{"ok": true, "redirect_url": "...", "message": "..."}`, browsers a 303 to `redirect_url` or the hosted thank-you page. Every accepted submission gets the same answer, also for suppressed, bounced or complained addresses (F-7). Every address on a double opt-in form (existing active contacts too) and unsubscribed contacts (always) get a confirmation email (at most one per 10 minutes and 3 per day per address); tags and the sequence apply after the click. A submission never overwrites a name or attribute an existing contact already has; it only fills in missing ones. Links expire 7 days after the first request; contacts a form created that were never confirmed are then deleted, other pending contacts are kept.

