          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Remove a manual suppression
      tags:
        - Suppressions
      x-mailroom-scope: admin
  /system/backups:
    get:
      description: |-
        Lists the local database backups (newest first) with their size and time, and the nightly schedule: the next run (02:30 in the settings time zone), how long local backups are kept (14 days) and the S3 bucket each backup is uploaded to, if any. Backups are consistent SQLite copies made with VACUUM INTO.

        Needs an API token with scope `read` or `admin`.
      operationId: list-backups
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupList"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - bearer: []
      summary: List backups
      tags:
        - System
      x-mailroom-scope: read
    post:
      description: |-
        Starts a backup job and answers 202 with the job; poll GET /api/v1/jobs/{id} until it has succeeded. The job writes a VACUUM INTO copy to the backups directory, deletes local backups older than 14 days and, when BACKUP_BUCKET is set, uploads the copy to S3 (server-side encrypted). A failed backup also alerts the owner. With `dry_run=true` nothing is queued: the returned job has `id` 0, does not exist and can't be polled.

        Needs an API token with scope `admin`.
      operationId: create-backup
      parameters:
        - description: Run the operation in a transaction that is rolled back, and return what would happen without changing anything.
          explode: false
          in: query
          name: dry_run
          schema:
            description: Run the operation in a transaction that is rolled back, and return what would happen without changing anything.
            type: boolean
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedBody"
          description: Accepted
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Take a backup
      tags:
        - System
      x-mailroom-scope: admin
