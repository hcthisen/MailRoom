    SegmentRule:
      additionalProperties: false
      properties:
        broadcast_id:
          description: "clicked only: count only clicks in this broadcast"
          examples:
            - 12
          format: int64
          minimum: 1
          type: integer
        days:
          description: "created_at within_days only: number of days"
          examples:
            - 30
          format: int64
          maximum: 3650
          minimum: 1
          type: integer
        field:
          description: "Condition only: what the condition tests"
          enum:
            - tag
            - tags
            - status
            - email
            - first_name
            - last_name
            - created_at
            - attr
            - clicked
          examples:
            - tag
          type: string
        key:
          description: "attr only: the attribute key (letters, digits, underscores)"
          examples:
            - plan
          maxLength: 64
          type: string
        match:
          description: "Group only: all (default) or any"
          enum:
            - all
            - any
          type: string
        op:
          description: Condition operator; which ones are allowed depends on field
          enum:
            - has
            - not_has
            - has_all
            - has_any
            - has_none
            - is
            - is_not
            - eq
            - neq
            - contains
            - ends_with
            - is_empty
            - not_empty
            - before
            - after
            - within_days
            - exists
            - not_exists
            - any_link
            - link
            - no_click
          examples:
            - has
          type: string
        rules:
          description: "Group only: the group's conditions and nested groups (at least one; groups nest up to depth 3)"
          items:
            $ref: "#/components/schemas/SegmentRule"
          maxItems: 50
          type:
            - array
            - "null"
        url:
          description: "clicked only: the exact link URL (required for link, optional for no_click)"
          examples:
