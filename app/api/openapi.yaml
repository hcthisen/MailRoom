    post:
      description: |-
        Imports contacts from a CSV file (I-1; format in docs/import-format.md): a header row with `email` (required), `first_name`, `last_name`, `status` (active, unsubscribed, bounced, complained), `tags` (semicolon-separated), `consent_source`, `consent_date` (RFC 3339 or YYYY-MM-DD) and `attr.<key>` columns. Send it as multipart/form-data (field `file`), as JSON `{"csv": "..."}`, or as a text/csv body; at most 50 MiB. Answers 202 with a job (type import.contacts); poll get-import for progress and the report. Every imported contact gets a consent event with source `import:<consent_source>` (I-2). Erased and suppressed addresses are rejected, and an import never reactivates a contact: a status only moves away from active. `?dry_run=true` evaluates the whole file now, writes nothing and answers 200 with `report`. A file without a header row or email column is 422 with field `file`.

        Needs an API token with scope `admin`.
      operationId: create-import
      parameters:
        - description: Run the operation in a transaction that is rolled back, and return what would happen without changing anything.
          explode: false
          in: query
          name: dry_run
          schema:
            description: Run the operation in a transaction that is rolled back, and return what would happen without changing anything.
            type: boolean
        - description: "What to do with contacts that already exist: update (default) fills in names and attributes and adds tags; skip leaves them as they are. Either way a status that blocks sending (unsubscribed, bounced, complained) is applied and no contact is ever reactivated. May also be sent as the on_existing form or JSON field."
          explode: false
          in: query
          name: on_existing
          schema:
            description: "What to do with contacts that already exist: update (default) fills in names and attributes and adds tags; skip leaves them as they are. Either way a status that blocks sending (unsubscribed, bounced, complained) is applied and no contact is ever reactivated. May also be sent as the on_existing form or JSON field."
            enum:
              - update
              - skip
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                csv:
                  description: The CSV text
                  examples:
                    - |
                      email,first_name,last_name,status,tags,consent_source,consent_date,attr.company
                      alice@example.com,Alice,Smith,active,newsletter;customer,ghl-form,2024-03-01,Acme
                      bob@example.com,Bob,,unsubscribed,newsletter,ghl-import,2023-11-20T09:30:00Z,
                  type: string
                on_existing:
                  description: Same as the on_existing query parameter
                  enum:
                    - update
                    - skip
                  type: string
              required:
                - csv
              type: object
          multipart/form-data:
            schema:
              properties:
                file:
                  contentMediaType: application/octet-stream
                  description: The CSV file
                  format: binary
                  type: string
                on_existing:
                  description: Same as the on_existing query parameter
                  enum:
                    - update
                    - skip
                  type: string
              required:
                - file
              type: object
          text/csv:
            schema:
              description: The CSV text
              examples:
                - |
                  email,first_name,last_name,status,tags,consent_source,consent_date,attr.company
                  alice@example.com,Alice,Smith,active,newsletter;customer,ghl-form,2024-03-01,Acme
                  bob@example.com,Bob,,unsubscribed,newsletter,ghl-import,2023-11-20T09:30:00Z,
              type: string
        description: The CSV file, at most 50 MiB
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
          description: "Dry run (?dry_run=true): the report of what the import would do, in `report`; nothing was written"
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
          description: Accepted
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Import contacts from CSV
      tags:
        - Imports
      x-mailroom-scope: admin
