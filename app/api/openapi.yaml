          description: Existing contacts the file lists as active that stay unsubscribed, bounced, complained or pending (also counted in updated or unchanged). Erased and manually suppressed addresses are rejected instead (reason suppressed)
          examples:
            - 3
          format: int64
          type: integer
        on_existing:
          description: What was done with existing contacts
          enum:
            - update
            - skip
          type: string
        rejected:
          description: The first 1000 rejected rows by line number (line numbers only, never addresses)
          items:
            $ref: "#/components/schemas/ImportRejection"
          type:
            - array
            - "null"
        rejected_count:
          description: Rows not imported
          examples:
            - 15
          format: int64
          type: integer
        rows:
          description: Data rows in the file (blank rows are skipped)
          examples:
            - 1200
          format: int64
          type: integer
        skipped:
          description: Existing contacts left alone because on_existing is skip
          examples:
            - 0
          format: int64
          type: integer
        status_counts:
          additionalProperties:
            format: int64
            type: integer
          description: "Contacts by their status after the import: those created, updated, unchanged or skipped, plus status_only contacts whose status was applied"
          examples:
            - active: 1150
              unsubscribed: 30
          type: object
        status_kept:
          description: Existing contacts whose status was kept because the file's status would make them easier to reactivate, e.g. bounced to unsubscribed (also counted in updated or unchanged)
          examples:
            - 1
          format: int64
          type: integer
        status_only:
          description: Contacts whose rows were rejected for an invalid field, but whose status that blocks sending (unsubscribed, bounced, complained) was still applied, so the address isn't left sendable (the rows are also counted in rejected_count)
          examples:
            - 1
          format: int64
          type: integer
        tag_counts:
          additionalProperties:
            format: int64
            type: integer
          description: Imported contacts per tag in the file
          examples:
            - newsletter: 900
          type: object
        unchanged:
          description: Existing contacts that already matched the file
          examples:
            - 20
          format: int64
          type: integer
        updated:
          description: Existing contacts that changed (names, attributes, tags or a blocking status)
          examples:
            - 60
          format: int64
          type: integer
        warnings:
          description: Problems with the file that didn't stop the import, e.g. ignored columns
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - dry_run
        - on_existing
