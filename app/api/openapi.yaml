  /contacts/{id}/status:
    post:
      description: |-
        Changes the status, recorded with source `api` (tokens) or `admin` (UI) and the note. The suppression rules apply (403 when refused): pending → active, unsubscribed → active and bounced → active need a `note`; complained contacts can never be reactivated; nothing moves back to pending; between non-active statuses only bounced/complained can be recorded (and complained over bounced). To block an address whatever its status, use add-suppression. Setting the current status is a no-op (`changed: false`). The suppressions table follows: suppressed_manual adds the address's hash (reason manual), and suppressed_manual → active removes it. Reactivating another contact whose address is suppressed is 409 conflict: remove the suppression first. A bounced or suppressed_manual contact that asked to unsubscribe meanwhile becomes unsubscribed instead of active (check `contact.status`). Setting `unsubscribed` on a bounced, complained or suppressed_manual contact (a request received by phone or email) keeps its status but records the request: the answer is 200 with `changed: true` and `contact.unsubscribe_requested_at` set, and lifting the bounce or suppression later lands on unsubscribed. A move to active from pending, unsubscribed or suppressed_manual is appended to the consent log (type api or admin, the note as its text).

        Needs an API token with scope `admin`.
      operationId: set-contact-status
      parameters:
        - description: Contact ID
          in: path
          name: id
          required: true
          schema:
            description: Contact ID
            examples:
              - 42
            format: int64
            minimum: 1
            type: integer
        - description: ETag of the version you last read (e.g. "v3"). If the resource changed since, the request fails with 412 instead of overwriting the change.
          in: header
          name: If-Match
          schema:
            description: ETag of the version you last read (e.g. "v3"). If the resource changed since, the request fails with 412 instead of overwriting the change.
            examples:
              - "\"v3\""
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStatusInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetStatusOutputBody"
          description: OK
          headers:
            ETag:
              schema:
                description: Version of the contact
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
