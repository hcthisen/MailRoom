        Runs the install checks of `mailroom doctor` (L-4) and returns each one with a status (ok, warn, fail, skipped), a message and a fix hint: DNS (app A/AAAA record, DKIM CNAMEs, MAIL FROM MX and SPF, DMARC), SES identity verification, production access, sending enabled and quota, SNS subscription of /hooks/ses, HTTPS certificate, last backup under 26 h old, clock skew against AWS, free disk space and the sender configuration. `status` is the worst check. The checks run concurrently and take at most 15 seconds.

